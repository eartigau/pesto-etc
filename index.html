<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PESTO Flux Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/style.css" />
</head>
<body>
  <div class="topbar">
    <a href="https://github.com/eartigau/pesto-etc" class="home-link" target="_blank">GitHub</a>
    <a href="https://eartigau.github.io/index_en.html#outils" class="home-link home-link-en">← Home</a>
    <a href="https://eartigau.github.io/index_fr.html#outils" class="home-link home-link-fr">← Accueil</a>
    <div class="lang-switch">
      <button id="btnFr" class="lang-btn" type="button">FR</button>
      <button id="btnEn" class="lang-btn" type="button">EN</button>
    </div>
  </div>
  <div class="page-shell">
    <nav class="sidebar" aria-label="Page navigation">
      <div class="sidebar-logo">PESTO ETC</div>
      <a class="nav-link" href="#searchCard" data-i18n="searchTitle"></a>
      <a class="nav-link" href="#telescopeCard" data-i18n="telescopeTitle"></a>
      <a class="nav-link" href="#resultsCard" data-i18n="resultsTitle"></a>
      <a class="nav-link" href="#snrCard" data-i18n="snrTitle"></a>
      <a class="nav-link" href="#airmassCard" data-i18n="airmassTitle"></a>
    </nav>
  <main>
    <h1>PESTO Flux Calculator</h1>
    <p id="tagline" class="tagline" data-i18n="tagline"></p>

    <section class="card" id="searchCard">
      <h2 data-i18n="searchTitle"></h2>
      <div class="mode-tabs">
        <button type="button" class="mode-tab active" data-mode="gaia" data-i18n="modeGaia"></button>
        <button type="button" class="mode-tab" data-mode="simbad" data-i18n="modeSimbad"></button>
        <button type="button" class="mode-tab" data-mode="manual" data-i18n="modeManual"></button>
        <button type="button" class="mode-tab" data-mode="solar" data-i18n="modeSolar"></button>
      </div>

      <div class="mode-panel" data-panel="gaia">
        <div class="query-row">
          <input id="gaiaId" type="text" placeholder="Ex: 5853498713190528" />
          <button id="fetchGaia" class="btn-sm" data-i18n="fetchBtn"></button>
        </div>
      </div>
      <div class="mode-panel hidden" data-panel="simbad">
        <div class="query-row">
          <input id="simbadName" type="text" placeholder="Ex: HD 189733" />
          <button id="resolveName" class="btn-sm" data-i18n="resolveBtn"></button>
        </div>
      </div>
      <div class="mode-panel hidden" data-panel="manual">
        <div class="param-grid">
          <div class="param-col">
            <label for="manualG" data-i18n="manualGLabel"></label>
            <input id="manualG" type="number" step="0.1" value="15" />
          </div>
          <div class="param-col">
            <label for="manualBpRp" data-i18n="manualBpRpLabel"></label>
            <input id="manualBpRp" type="number" step="0.1" value="0.8" />
          </div>
        </div>
        <div class="row">
          <button id="computeManual" class="btn-sm" data-i18n="computeBtn"></button>
        </div>
      </div>
      <div class="mode-panel hidden" data-panel="solar">
        <div class="param-grid">
          <div class="param-col">
            <label for="solarBody" data-i18n="solarBodyLabel"></label>
            <select id="solarBody">
              <option value="Moon" data-i18n="bodyMoon"></option>
              <option value="Mercury" data-i18n="bodyMercury"></option>
              <option value="Venus" data-i18n="bodyVenus"></option>
              <option value="Mars" data-i18n="bodyMars"></option>
              <option value="Jupiter" data-i18n="bodyJupiter"></option>
              <option value="Saturn" data-i18n="bodySaturn"></option>
              <option value="Uranus" data-i18n="bodyUranus"></option>
              <option value="Neptune" data-i18n="bodyNeptune"></option>
            </select>
          </div>
        </div>
        <div class="row">
          <button id="computeSolar" class="btn-sm" data-i18n="computeBtn"></button>
        </div>
      </div>

      <div id="status" class="status"></div>
    </section>

    <section class="card" id="telescopeCard">
      <h2 data-i18n="telescopeTitle"></h2>
      <label class="override-row">
        <input id="overrideParams" type="checkbox" />
        <span data-i18n="overrideLabel"></span>
      </label>
      <div class="param-grid">
        <div class="param-col">
          <label for="mirrorSize" data-i18n="mirrorLabel"></label>
          <input id="mirrorSize" type="number" min="0.1" step="0.1" value="1.6" disabled />
        </div>
        <div class="param-col">
          <label for="efficiency" data-i18n="efficiencyLabel"></label>
          <input id="efficiency" type="number" min="0" max="2" step="0.01" value="1.0" disabled />
        </div>
        <div class="param-col">
          <label for="fwhm" data-i18n="fwhmLabel"></label>
          <input id="fwhm" type="number" min="0.1" step="0.1" value="2.0" disabled />
        </div>
        <div class="param-col">
          <label for="pixscale" data-i18n="pixscaleLabel"></label>
          <input id="pixscale" type="number" min="0.01" step="0.01" value="0.46" disabled />
        </div>
        <div class="param-col">
          <label for="frameTime" data-i18n="frameTimeLabel"></label>
          <input id="frameTime" type="number" min="0.001" step="0.01" value="0.06" disabled />
        </div>
        <div class="param-col">
          <label for="ttot" data-i18n="ttotLabel"></label>
          <input id="ttot" type="number" min="0.01" step="1" value="60" disabled />
        </div>
        <div class="param-col">
          <label for="detMode" data-i18n="detModeLabel"></label>
          <select id="detMode" disabled>
            <option value="Conv" data-i18n="modeConvOpt"></option>
            <option value="EM" data-i18n="modeEmOpt"></option>
            <option value="PC" data-i18n="modePcOpt"></option>
          </select>
        </div>
        <div class="param-col">
          <label for="emGain" data-i18n="emGainLabel"></label>
          <input id="emGain" type="number" min="1" max="5000" step="1" value="1" disabled />
        </div>
        <div class="param-col">
          <label for="ccdTemp" data-i18n="ccdTempLabel"></label>
          <input id="ccdTemp" type="number" min="-90" max="-60" step="1" value="-85" disabled />
        </div>
      </div>
      <div class="row">
        <button id="computeFlux" class="btn-sm" data-i18n="recomputeBtn"></button>
      </div>
      <div class="date-row">
        <label for="airmassDate" data-i18n="airmassDateLabel"></label>
        <input id="airmassDate" type="range" min="1" max="365" value="1" />
        <span id="airmassDateLabel" class="date-label"></span>
      </div>
    </section>

    <section class="card" id="resultsCard">
      <h2 data-i18n="resultsTitle"></h2>
      <div id="starInfo" class="star-panel"></div>
      <div id="fluxAirmassNote" class="info"></div>
      <table id="fluxTable" class="results-table hidden">
        <thead>
          <tr>
            <th data-i18n="thBand"></th>
            <th data-i18n="thMag"></th>
            <th data-i18n="thFlux"></th>
            <th data-i18n="thPeak"></th>
            <th data-i18n="thElectrons"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="solarInfo" class="star-panel hidden"></div>
      <table id="solarTable" class="results-table hidden">
        <thead>
          <tr>
            <th data-i18n="thBand"></th>
            <th data-i18n="thMagArcsec2"></th>
            <th data-i18n="thFluxPerPixel"></th>
            <th data-i18n="thElectrons"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card hidden" id="snrCard">
      <h2 data-i18n="snrTitle"></h2>
      <div id="snrNote" class="info"></div>
      <table id="snrTable" class="results-table hidden">
        <thead>
          <tr>
            <th data-i18n="thBand"></th>
            <th data-i18n="thSnr"></th>
            <th data-i18n="thPhotErr"></th>
            <th data-i18n="thAduPeak"></th>
            <th data-i18n="thAduSky"></th>
            <th data-i18n="thSatMag"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card hidden" id="airmassCard">
      <h2 data-i18n="airmassTitle"></h2>
      <div id="airmassCaption" class="info"></div>
      <div id="airmassWarning" class="airmass-warning hidden"></div>
      <canvas id="airmassChart" width="760" height="260"></canvas>
      <div class="airmass-legend">
        <span><i class="swatch swatch-line"></i><span data-i18n="legendTarget"></span></span>
        <span><i class="swatch swatch-twilight"></i><span data-i18n="legendTwilight"></span></span>
        <span><i class="swatch swatch-night"></i><span data-i18n="legendNight"></span></span>
        <span><i class="swatch swatch-now"></i><span data-i18n="legendNow"></span></span>
      </div>
    </section>
  </main>
  </div>
  <script src="static/main.js"></script>
</body>
</html>
